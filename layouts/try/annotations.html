{{ define "head-extra" }}
<style>
  #annotation-controls {
    display: grid;
    grid-template-columns: minmax(160px, 1fr) 120px minmax(250px, 2fr);
    gap: 12px;
    margin: 18px 0;
    padding: 16px;
    border: 1px solid var(--color-border);
    border-radius: 12px;
    background: var(--color-bg-alt);
  }
  .annotation-field { display: flex; flex-direction: column; gap: 6px; }
  .annotation-field label { font-weight: 600; }
  .annotation-field select, .annotation-field input, .annotation-actions button, #annotation-list, #annotation-json { font: inherit; }
  .annotation-field select, .annotation-field input, #annotation-list, #annotation-json { border: 1px solid var(--color-border); border-radius: 6px; padding: 7px; }
  .annotation-actions { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .annotation-actions button { border: 0; border-radius: 8px; background: var(--color-primary); color: #fff; font-weight: 600; padding: 10px 14px; cursor: pointer; }
  .annotation-actions button.secondary { background: var(--color-text-muted); }
  .annotation-actions button:disabled { cursor: not-allowed; opacity: 0.6; }
  #annotation-status { color: var(--color-text-muted); margin: 8px 0; }
  #annotation-inspection { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(340px, 2fr); gap: 12px; margin-bottom: 18px; }
  #annotation-inspection label { display: block; font-weight: 600; margin-bottom: 6px; }
  #annotation-list { width: 100%; min-height: 210px; }
  #annotation-json { box-sizing: border-box; min-height: 210px; resize: vertical; width: 100%; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #diva-wrapper { display: flex; height: 72vh; min-height: 500px; width: 100%; }
  @media (max-width: 760px) { #annotation-controls, #annotation-inspection { grid-template-columns: 1fr; } }
</style>
{{ end }}

{{ define "main" }}
<section class="container container-wide content">
  <h1>{{ .Title }}</h1>
  <p class="lead">{{ .Description }}</p>
  {{ .Content }}
</section>

<section class="container container-wide">
  <div id="annotation-controls">
    <div class="annotation-field">
      <label for="annotation-kind">Annotation shape</label>
      <select id="annotation-kind"><option value="mixed" selected>Mixed rectangles and SVG shapes</option><option value="xywh">Rectangles</option><option value="svg">Random SVG shapes</option></select>
    </div>
    <div class="annotation-field">
      <label for="annotation-count">Count</label>
      <input id="annotation-count" type="number" min="10" max="100" value="30">
    </div>
    <div class="annotation-actions">
      <button id="generate-annotations" type="button" disabled>Generate annotations</button>
      <button id="clear-visible" class="secondary" type="button" disabled>Clear visible</button>
      <button id="clear-all" class="secondary" type="button" disabled>Clear all</button>
    </div>
  </div>
  <p id="annotation-status" role="status" aria-live="polite">Loading viewer…</p>
  <div id="annotation-inspection">
    <div><label for="annotation-list">Generated annotations</label><select id="annotation-list" size="8"></select></div>
    <div><label for="annotation-json">Selected annotation JSON</label><textarea id="annotation-json" readonly></textarea></div>
  </div>
  <div id="diva-wrapper"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/openseadragon@6.1.0/build/openseadragon/openseadragon.min.js"></script>
<script src="/js/diva.js"></script>
<script>
  (function () {
    if (typeof window.Diva !== "function") return;
    const status = document.getElementById("annotation-status");
    const list = document.getElementById("annotation-list");
    const json = document.getElementById("annotation-json");
    const kind = document.getElementById("annotation-kind");
    const count = document.getElementById("annotation-count");
    let annotations = [];
    let serial = 0;
    const buttons = Array.from(document.querySelectorAll(".annotation-actions button"));
    const viewer = new Diva("diva-wrapper", {
      objectData: "{{ .Params.manifest }}",
      sidebarPanel: "contents",
      sidebarWidth: 520,
      staticImageCorsPolicy: "fallback",
      enableAnnotations: true,
      showSidebar: true,
      showTitle: true
    });

    const lorem = [
      "Lorem ipsum dolor sit amet.",
      "Consectetur adipiscing elit.",
      "Sed do eiusmod tempor incididunt ut labore.",
      "Ut enim ad minim veniam, quis nostrud exercitation.",
      "Duis aute irure dolor in reprehenderit."
    ];

    function randomBetween(min, max) { return min + Math.random() * (max - min); }

    function randomSvgShape(x, y, width, height) {
      const inset = 0.08;
      const left = x + width * inset;
      const top = y + height * inset;
      const innerWidth = width * (1 - inset * 2);
      const innerHeight = height * (1 - inset * 2);
      const shape = Math.floor(Math.random() * 5);
      if (shape === 2) {
        const radius = Math.min(innerWidth, innerHeight) / 2;
        return "<circle cx='" + (left + innerWidth / 2) + "' cy='" + (top + innerHeight / 2) + "' r='" + radius + "'/>";
      }
      let points;
      if (shape === 0) {
        points = [[0.5, 0], [1, 1], [0, 1]];
      } else if (shape === 1) {
        points = [[0.5, 0], [1, 0.5], [0.5, 1], [0, 0.5]];
      } else if (shape === 3) {
        points = Array.from({ length: 12 }, function (_, index) {
          const angle = -Math.PI / 2 + index * Math.PI / 6;
          return [0.5 + Math.cos(angle) * 0.5, 0.5 + Math.sin(angle) * 0.5];
        });
      } else {
        points = Array.from({ length: 10 }, function (_, index) {
          const angle = -Math.PI / 2 + index * Math.PI / 5;
          const radius = index % 2 === 0 ? 0.5 : 0.22;
          return [0.5 + Math.cos(angle) * radius, 0.5 + Math.sin(angle) * radius];
        });
      }
      return "<polygon points='" + points.map(function (point) { return (left + innerWidth * point[0]) + "," + (top + innerHeight * point[1]); }).join(" ") + "'/>";
    }

    function annotationFor(page, index) {
      const width = page.width, height = page.height;
      let boxWidth = randomBetween(width * 0.05, width * 0.3);
      let boxHeight = randomBetween(height * 0.05, height * 0.3);
      const maxArea = width * height / 8;
      if (boxWidth * boxHeight > maxArea) boxHeight = maxArea / boxWidth;
      boxHeight = Math.max(height * 0.05, boxHeight);
      if (boxWidth * boxHeight > maxArea) boxWidth = maxArea / boxHeight;
      const x = randomBetween(0, width - boxWidth);
      const y = randomBetween(0, height - boxHeight);
      const annotationKind = kind.value === "mixed" ? (Math.random() < 0.5 ? "xywh" : "svg") : kind.value;
      const id = "https://example.org/diva-demo/annotations/" + Date.now() + "-" + serial++;
      let selector;
      if (annotationKind === "xywh") {
        selector = { type: "FragmentSelector", conformsTo: "http://www.w3.org/TR/media-frags/", value: "xywh=" + [x, y, boxWidth, boxHeight].join(",") };
      } else {
        selector = { type: "SvgSelector", value: "<svg xmlns='http://www.w3.org/2000/svg'>" + randomSvgShape(x, y, boxWidth, boxHeight) + "</svg>" };
      }
      return { id: id, type: "Annotation", motivation: "commenting", body: { type: "TextualBody", format: "text/plain", value: lorem[Math.floor(Math.random() * lorem.length)] }, target: { type: "SpecificResource", source: page.canvasId, selector: selector } };
    }

    function refresh() {
      list.replaceChildren(...annotations.map(function (annotation, index) { const option = document.createElement("option"); option.value = String(index); option.textContent = (index + 1) + ". " + annotation.id; return option; }));
      if (annotations.length) { list.value = "0"; showSelected(); } else json.value = "";
    }
    function showSelected() { const annotation = annotations[Number(list.value)]; json.value = annotation ? JSON.stringify(annotation, null, 2) : ""; }
    function visiblePages() { return viewer.getVisiblePages().filter(function (page) { return Number.isFinite(page.width) && Number.isFinite(page.height); }); }

    document.getElementById("generate-annotations").addEventListener("click", function () {
      const pages = visiblePages();
      const requested = Math.max(10, Math.min(100, Number(count.value) || 30)); count.value = requested;
      if (!pages.length) { status.textContent = "No visible canvas dimensions are available yet."; return; }
      annotations = Array.from({ length: requested }, function (_, index) { return annotationFor(pages[index % pages.length], index); });
      viewer.setAnnotations(annotations); refresh(); status.textContent = "Applied " + annotations.length + " annotation(s) to " + pages.length + " visible canvas(es).";
    });
    document.getElementById("clear-visible").addEventListener("click", function () {
      const ids = new Set(visiblePages().map(function (page) { return page.canvasId; })); ids.forEach(function (id) { viewer.clearAnnotationsForCanvas(id); });
      annotations = annotations.filter(function (annotation) { return !ids.has(annotation.target.source); }); refresh(); status.textContent = "Cleared annotations on " + ids.size + " visible canvas(es).";
    });
    document.getElementById("clear-all").addEventListener("click", function () { viewer.clearAllAnnotations(); annotations = []; refresh(); status.textContent = "Cleared all annotations."; });
    list.addEventListener("change", function () { const annotation = annotations[Number(list.value)]; showSelected(); if (annotation) viewer.selectAnnotation(annotation.id); });
    viewer.addEventListener("annotationselect", function (event) { const index = annotations.findIndex(function (annotation) { return annotation.id === event.detail.annotationId; }); if (index >= 0) { list.value = String(index); showSelected(); } });
    viewer.addEventListener("pagechange", function (event) { status.textContent = annotations.length + " generated annotation(s); " + event.detail.visiblePages.length + " canvas(es) visible."; });
    viewer.addEventListener("ready", function () { buttons.forEach(function (button) { button.disabled = false; }); status.textContent = "Ready. Generate annotations for the visible page."; }, { once: true });
    viewer.addEventListener("error", function (event) { status.textContent = "Error: " + (event.detail.error && event.detail.error.message ? event.detail.error.message : "The viewer could not load the resource."); });
  })();
</script>
{{ end }}
